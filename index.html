<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QueryShift</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17202a;
        --muted: #5f6b7a;
        --line: #dfe5ec;
        --accent: #3563e9;
        --bg: #f7f9fc;
        --panel: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--bg);
        line-height: 1.6;
      }

      main {
        width: min(880px, calc(100% - 32px));
        margin: 48px auto;
        padding: 32px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 32px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 18px;
        color: var(--muted);
      }

      nav {
        display: grid;
        gap: 12px;
        margin-top: 28px;
      }

      a {
        color: var(--accent);
        font-weight: 650;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>QueryShift</h1>
      <p>QueryShift is an internal automation utility used to create and publish content to an authorized Instagram business or creator account.</p>
      <nav aria-label="Legal pages">
        <a href="./privacy.html">Privacy Policy</a>
        <a href="./terms.html">Terms of Service</a>
        <a href="./delete-data.html">Data Deletion Instructions</a>
      </nav>
    </main>
  </body>
</html>
